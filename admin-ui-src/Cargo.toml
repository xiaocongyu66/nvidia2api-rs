[package]
name = "nvidia2api-admin-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }
dioxus = { version = "0.7", features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
gloo-net = "0.6"
wasm-bindgen-futures = "0.4"

[profile.dev]
opt-level = 1
