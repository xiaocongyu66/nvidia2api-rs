[package]
name = "nvidia2api-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["json", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "socks", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
tokio-stream = "0.1"
async-stream = "0.3"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
http = "1"
include_dir = "0.7.4"
playwright-rs = "0.18"
bytes = "1"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
flate2 = "1"
# tunnel 代理协议栈 (自 freebuff-rs 移植): socks5/trojan/vless/ss/hy2
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "0.26"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
hkdf = "0.12"
blake2 = "0.10"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
socket2 = "0.6"
md-5 = "0.10"
base64 = "0.22"
